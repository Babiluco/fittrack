<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FitTrack — Treinos e Progresso</title>
<meta name="description" content="Organize seus treinos, acompanhe seu progresso e siga seu cronograma semanal.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitTrack">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="css/style.css">
<style>
.pwa-update{
  position:fixed;
  left:16px;
  right:16px;
  bottom:calc(18px + env(safe-area-inset-bottom));
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  max-width:520px;
  margin:0 auto;
  padding:14px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:18px;
  background:rgba(18,20,32,.84);
  box-shadow:0 18px 45px rgba(0,0,0,.38);
  color:#fff;
  font-family:Poppins, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  backdrop-filter:blur(18px) saturate(1.25);
  -webkit-backdrop-filter:blur(18px) saturate(1.25);
}
.pwa-update.is-visible{display:flex;}
.pwa-update strong{display:block;font-size:13px;line-height:1.25;}
.pwa-update span{display:block;margin-top:2px;color:rgba(255,255,255,.68);font-size:12px;line-height:1.35;}
.pwa-update button{
  flex:0 0 auto;
  min-height:42px;
  padding:0 16px;
  border:0;
  border-radius:999px;
  background:#3355ff;
  color:#fff;
  font:700 13px/1 Poppins, system-ui, sans-serif;
}
</style>
</head>
<body>

<div class="loader-screen" id="loader">
  <div class="loader-ring"></div>
  <p>Carregando seu treino...</p>
</div>

<div id="app"></div>
<div class="pwa-update" id="pwaUpdatePrompt" role="status" aria-live="polite">
  <div>
    <strong>Nova versão disponível</strong>
    <span>Atualize para carregar as últimas mudanças.</span>
  </div>
  <button type="button" id="pwaUpdateBtn">Atualizar</button>
</div>

<script>
window.addEventListener('error', function(event){
  console.error('[FitTrack] erro de carregamento', event.error || event.message);
});
window.FitTrackPWA = (function(){
  var deferredPrompt = null;

  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }

  function isIOS(){
    return /iphone|ipad|ipod/i.test(window.navigator.userAgent || '');
  }

  window.addEventListener('beforeinstallprompt', function(event){
    event.preventDefault();
    deferredPrompt = event;
    window.dispatchEvent(new CustomEvent('fittrack:pwa-ready'));
  });

  window.addEventListener('appinstalled', function(){
    deferredPrompt = null;
    window.dispatchEvent(new CustomEvent('fittrack:pwa-installed'));
  });

  return {
    isStandalone: isStandalone,
    isIOS: isIOS,
    canInstall: function(){
      return !!deferredPrompt && !isStandalone();
    },
    install: async function(){
      if(!deferredPrompt || isStandalone()) return {ok:false, reason:'unavailable'};
      deferredPrompt.prompt();
      var result = await deferredPrompt.userChoice;
      deferredPrompt = null;
      return {ok:result.outcome === 'accepted', outcome:result.outcome};
    }
  };
})();
setTimeout(function(){
  var loader = document.getElementById('loader');
  var app = document.getElementById('app');
  if(!loader || !app || app.children.length) return;
  loader.remove();
  app.innerHTML = '<main class="auth-page"><section class="auth-panel"><div class="auth-brand"><img src="icons/icon-192.png" alt="" class="brand-mark"><div><div class="brand-name">FitTrack</div><span>1.0.0</span></div></div><div class="auth-copy"><h1>Não foi possível carregar</h1><p>Atualize a página. Se continuar, limpe o cache do navegador e tente novamente.</p></div><button class="btn btn-primary btn-block" type="button" onclick="window.location.reload()">Tentar novamente</button></section></main>';
}, 15000);
</script>

<script defer src="js/config.js"></script>
<script defer src="js/utils.js"></script>
<script defer src="js/storage.js"></script>
<script defer src="js/database.js"></script>
<script defer src="js/api.js"></script>
<script defer src="js/supabase.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/profile.js"></script>
<script defer src="js/sync.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/icons.js"></script>
<script defer src="js/insights.js"></script>
<script defer src="js/progression.js"></script>
<script defer src="js/calendar.js"></script>
<script defer src="js/photos.js"></script>
<script defer src="js/timer.js"></script>
<script defer src="js/charts.js"></script>
<script defer src="js/app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    var refreshing = false;
    var updatePrompt = document.getElementById('pwaUpdatePrompt');
    var updateButton = document.getElementById('pwaUpdateBtn');

    function showUpdatePrompt(registration){
      if(!registration || !registration.waiting || !updatePrompt || !updateButton) return;
      updatePrompt.classList.add('is-visible');
      updateButton.onclick = function(){
        updateButton.disabled = true;
        updateButton.textContent = 'Atualizando...';
        registration.waiting.postMessage({type:'SKIP_WAITING'});
      };
    }

    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(refreshing) return;
      refreshing = true;
      window.location.reload();
    });

    navigator.serviceWorker.register('./sw.js').then(function(registration){
      if(registration.waiting){
        showUpdatePrompt(registration);
      }

      registration.addEventListener('updatefound', function(){
        var newWorker = registration.installing;
        if(!newWorker) return;
        newWorker.addEventListener('statechange', function(){
          if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
            showUpdatePrompt(registration);
          }
        });
      });

      setInterval(function(){
        registration.update();
      }, 60 * 60 * 1000);
    }).catch(function(error){
      console.error('[FitTrack] service worker nao registrado', error);
    });
  });
}
</script>
</body>
</html>
